services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: faultdb
      POSTGRES_USER: fault_admin
      POSTGRES_PASSWORD: fault_admin
    ports:
      - "5432:5432"
    volumes:
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fault_admin -d faultdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgresql://fault_ro:fault_ro@db:5432/faultdb
      POOL_SIZE: "2"
    ports:
      - "8000:8000"
    # SIGTERM starts the graceful drain: queued requests get an immediate
    # pool_closed receipt, in-flight queries finish under their own deadline,
    # then every backend is closed.  Give that drain time before SIGKILL.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
